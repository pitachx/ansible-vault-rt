name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version from lockfile
        id: version
        run: |
          VERSION="$(node -p "require('./package-lock.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Lockfile version: ${VERSION}"

      - name: Package VSIX
        run: npx --yes @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-vault-rt-${{ steps.version.outputs.version }}
          path: ansible-vault-rt-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${VERSION} already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${VERSION} does not exist; will publish."
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: ansible-vault-rt-${{ steps.version.outputs.version }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
